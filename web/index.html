<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="benj tells a small shop owner what to restock, how much, and when, before they run out.">
  <meta name="theme-color" content="#080B18">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="benj">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>benj</title>
  <style>
    html, body { margin: 0; height: 100%; background: #080B18; overscroll-behavior: none; }
    #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #080B18; z-index: 9; transition: opacity .45s ease; }
    #boot-logo { position: relative; width: 148px; height: 148px; }
    /* Plain logo first, so even the slowest phone never stares at a blank screen. */
    #boot-svg { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .9; transition: opacity .3s; }
    #boot-bar { position: absolute; bottom: 72px; left: 50%; width: 88px; height: 2px; margin-left: -44px; background: #1B2140; border-radius: 2px; overflow: hidden; }
    #boot-bar i { display: block; width: 40%; height: 100%; background: #FFB627; border-radius: 2px; animation: b 1.2s ease-in-out infinite; }
    @keyframes b { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  </style>
</head>
<body>
  <div id="boot">
    <div id="boot-logo">
      <svg id="boot-svg" viewBox="0 0 100 100" fill="none" aria-label="benj">
        <path d="M33 16V66" stroke="#FFB627" stroke-width="13" stroke-linecap="round"/>
        <circle cx="52" cy="62" r="19.5" stroke="#FFB627" stroke-width="13"/>
        <path d="M52 53.2C52.6 58.4 54.6 60.8 60.8 62C54.6 63.2 52.6 65.6 52 70.8C51.4 65.6 49.4 63.2 43.2 62C49.4 60.8 51.4 58.4 52 53.2Z" fill="#FFB627"/>
      </svg>
    </div>
    <div id="boot-bar"><i></i></div>
  </div>
  <script type="module">
    // Pour the logo in liquid metal once the shader is ready.
    import { mount } from './fx/glyph.js';
    const host = document.getElementById('boot-logo');
    try {
      const h = mount(host, { look: 'metal' });
      document.getElementById('boot-svg').style.opacity = 0;
      window.__bootGlyph = h;
    } catch (_) { /* The plain logo is already showing. */ }
  </script>
  <script type="module" src="fx/fx.js"></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('boot');
      b.style.opacity = 0;
      setTimeout(function () { b.remove(); if (window.__bootGlyph) window.__bootGlyph.dispose(); }, 500);
    });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js'); });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
