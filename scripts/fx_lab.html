<!doctype html>
<!-- Dev only: render one effect full-window. Served by scripts/shot.py from web/ with this page copied in. -->
<meta charset="utf-8" />
<style>html,body{margin:0;height:100%;background:#0a0d1c}#s{position:absolute;inset:0}</style>
<div id="s"></div>
<script type="module">
  const q = new URLSearchParams(location.search);
  const kind = q.get('kind') || 'mascot';
  const cfg = JSON.parse(q.get('cfg') || '{}');
  const mod = await import(`./fx/${kind}.js`);
  window.h = mod.mount(document.getElementById('s'), { ...cfg, capture: true });
  window.ready = true;
</script>
